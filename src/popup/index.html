<!doctype html>
<html lang="en" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <link rel="icon" type="image/png" href="/icons/icon48.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shieldmonkey</title>
  <style>
    :root { color-scheme: dark; --popup-host-bg: #1b1d1b; --popup-host-surface: #242724; --popup-host-border: #626a63; --popup-host-text: #f0f1ed; }
    :root[data-theme="light"] { color-scheme: light; --popup-host-bg: #f3f3ef; --popup-host-surface: #fff; --popup-host-border: #929b94; --popup-host-text: #171a17; }
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; color: var(--popup-host-text); background: var(--popup-host-bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #popup-placeholder { position: absolute; inset: 0; border: 1px solid var(--popup-host-border); background: var(--popup-host-bg); }
    #popup-placeholder[data-error="true"] { display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; }
    #popup-placeholder p { margin: 0; font-size: 13px; }
    #popup-placeholder button { min-height: 32px; padding: 5px 12px; border: 1px solid var(--popup-host-border); border-radius: 2px; color: inherit; background: var(--popup-host-surface); font: inherit; cursor: pointer; }
  </style>
</head>

<body>
  <div id="root"><div id="popup-placeholder" aria-hidden="true"></div></div>
  <script type="module" src="./main.tsx"></script>
</body>

</html>
